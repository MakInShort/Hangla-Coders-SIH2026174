[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bas-assistant"
version = "0.1.0"
description = "AI-based autonomous experiment execution and validation assistant for human spaceflight (SIH 2026 ISRO). Observe -> Understand -> Predict -> Validate -> Guide -> Record."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mainak Mondal" }]
keywords = ["computer-vision", "pose-estimation", "activity-recognition", "spaceflight", "sih"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "av>=17.1.0",
  "label-studio>=1.21.0",
  "mediapipe==0.10.21",
  "numpy>=1.26",
  "opencv-contrib-python-headless==4.11.0.86",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.9.0",
  "streamlit>=1.60.0",
  "streamlit-webrtc>=0.77.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "ultralytics>=8.4.135",
  "xgboost>=3.2.0",
]

[project.optional-dependencies]
ml = [
  "xgboost>=2.0",
  "scikit-learn>=1.3",
  "mediapipe>=0.10",
]

ui = [
  "PySide6>=6.6",
]

dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.8",
]

# Full install for the PoC demo/training machine.
all = [
  "bas-assistant[ml,ui,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bas_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
